services:
  # Servidor Backend Web (Node.js)
  - type: web
    name: unigames-server
    env: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Pega el link de Neon desde el Dashboard de Render manualmente, o pon un placeholder temporal
      - key: DATABASE_URL
        sync: false
      # Modo producción para ignorar certificados SSL si es necesario
      - key: NODE_ENV
        value: production
      # Token Secreto para JWT
      - key: JWT_SECRET
        generateValue: true
      # Supabase Auth: routes/auth.js crea el cliente al cargar, sin esto el server no arranca.
      # Cargar los valores reales desde el Dashboard de Render (Settings > Environment).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
