services:
  # Servidor Backend Web (Node.js)
  - type: web
    name: unigames-server
    env: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Pega el link de Neon desde el Dashboard de Render manualmente, o pon un placeholder temporal
      - key: DATABASE_URL
        sync: false
      # Modo producción para ignorar certificados SSL si es necesario
      - key: NODE_ENV
        value: production
      # Token Secreto para JWT
      - key: JWT_SECRET
        generateValue: true
      # Secreto para crear administradores y usar /api/dev-login
      - key: DEV_SECRET
        generateValue: true
